---
ansible-navigator:
  ansible:
    inventory:
      entries:
        - /home/ansibleuser/inventory
  execution-environment:
    image: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9
    pull:
      policy: missing
    container-options:
      - "--net=host"
  playbook-artifact:
    enable: false
  mode: stdout
  logging:
    level: info
    file: /dev/null
