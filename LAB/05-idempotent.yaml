---
- name: Playbook Demonstrating Idempotence Nature
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Create a file with a timestamp ONLY if it does not exist yet
      copy:
        content: "This file was created at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/non_idempotent_file.txt
        force: false  # <-- Prevents overwriting the file if it already exists

    - name: Simply copy content without block indicators
      copy:
        content: "I am simple content\n"
        dest: /tmp/simple.txt

    - name: Copy content with | character (Preserves Line Breaks)
      copy:
        content: |
          I am at line1
          Now, starting a new line from here
          and more....
          and at last, one more.
        dest: /tmp/pipe.txt

    - name: Copy content with > character (Folds to Single Line)
      copy:
        content: >
          All texts in one line only.
          But it looks like in a multiple line.
          When we see this, it is a single line only.
        dest: /tmp/oneline.txt

    - name: Run a command idempotently using a tracking condition
      command: echo "This command runs ONLY once because it creates a lockfile"
      args:
        creates: /tmp/command_ran.txt  # <-- Skips running if this file exists

    - name: Run a shell command idempotently using a tracking condition
      shell: echo "This shell command will run only once" > /tmp/output.txt
      args:
        creates: /tmp/output.txt  # <-- Skips running if the output file is already there
