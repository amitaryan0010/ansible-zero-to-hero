---
- name: Time Sync via Rhel-ROLE
  hosts: centos9
  gather_facts: no

  vars:
    host_timezone: 'Asia/Dubai'

  pre_tasks:
    - name: Time zone will be set on {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "It will set to {{ host_timezone }}"

    - name: Pause for validation
      ansible.builtin.pause:
        prompt: "Verify TimeZone and press ENTER to continue to update..."

  roles:
    #- role: rhel-system-roles.timesync # <-- Use this for ansible-core
    - role: redhat.rhel_system_roles.timesync # <-- Update to Collection Syntax for EE
      vars:
        timesync_chrony_custom_settings:
          - "logdir /var/log/chrony"
        timesync_ntp_servers:
          - hostname: 2.rhel.pool.ntp.org
            iburst: yes
            pool: yes
          - hostname: time.google.com
            iburst : yes

  tasks:
    - name: Changing the timezone
      ansible.builtin.timezone:
        name: "{{ host_timezone }}"
      notify: restart crond service

  post_tasks:
    - name: Time Sync is done
      ansible.builtin.debug:
        msg: "Time has been synchronized and Time Zone changed to {{ host_timezone }}."

  handlers:
    - name: restart crond service
      ansible.builtin.service:
        name: crond
        state: restarted
