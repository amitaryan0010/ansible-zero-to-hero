---
# Facts must be cached or gathered for centos9 first: The docker host cannot log into centos9 to read its files. If centos9 is not part of the same play run (or if you don't have Fact Caching enabled), hostvars['centos9'] will be completely empty.

# Play 1: Force Ansible to collect facts from centos9 first
- name: Pre-load facts for centos9 host
  hosts: centos9
  gather_facts: yes

# Play 2: Run your main logic on the docker host
- name: Reading custom facts from another host
  hosts: docker
  gather_facts: yes

  tasks:
    - name: Display custom fact for docker host
      ansible.builtin.debug:
        msg: "welcome to {{ hostvars['centos9']['ansible_local']['info']['ansible_training']['trainer'] }}"
