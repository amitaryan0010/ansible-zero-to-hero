---
- name: Run a diagnostic check
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Run a command that may fail
      ansible.builtin.command: /usr/bin/systemctl is-active httpd
      register: output
      ignore_errors: yes

    - name: Check the return code and display a message
      ansible.builtin.debug:
        msg: "The command failed with return code {{ output.rc }}"
      when: output.rc != 0

    - name: Display a success message if the command succeeded
      ansible.builtin.debug:
        msg: "The command succeeded with return code {{ output.rc }}"
      when: output.rc == 0
